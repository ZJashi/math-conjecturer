[project]
name = "math-conjecturer"
version = "0.1.0"
description = "Multi-agent system for generating research proposals from arXiv papers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=2.3.1",
    "chromadb>=1.3.4",
    "langchain>=1.0.7",
    "langchain-community>=0.4.1",
    "langchain-core>=1.0.5",
    "langchain-google-genai>=3.0.3",
    "langgraph>=1.0.3",
    "pydantic==2.9.0",
    "pyppeteer>=0.0.25",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "sentence-transformers>=5.1.2",
]
